{% from 'bootstrap4/form.html' import render_form %}

{% extends 'admin-layout.html' %}

{% block title %}{{ _('admin.menu.proxy') }}{% endblock %}

{% block body %}
{{super()}}

<div class="card">
    <div class="card-header">
        {{_("admin.proxy.global_config")}}
    </div>
    <div class="card-body">
        <div class="global-form">
            {{render_form(global_config_form,extra_classes="toggle-grid")}}
        </div>
    </div>
</div>


<style>
    fieldset {
        background-color: initial;
        background-clip: border-box;
        border: 1 solid rgba(0, 0, 0, 0.125);
        border-radius: 0.25rem;
        box-shadow: 0 0 1px rgb(0 0 0 / 13%), 0 1px 3px rgb(0 0 0 / 20%);
        margin-bottom: 1rem;
        padding: 10px;
        display: inline-block;
        width: 100%;
    }

    legend {
        background-color: initial;
        margin: 0px;
    }

    @media (min-width: 576px) {
        .card-columns {
            column-count: 1;
        }
    }

    @media (min-width: 768px) {
        .card-columns {
            column-count: 2;
        }
    }

    /* Global config toggles as a 2-col grid of toggle-row cards, matching
       the new design's Proxies page - the switches themselves are still
       plain WTForms SwitchField output (.custom-control-input/-label),
       just re-laid-out via the shared .toggle-grid/.toggle-row CSS in
       admin-layout.html instead of a hand-rolled markup rebuild. */
    .global-form .toggle-grid {
        display: grid;
    }
    .global-form .form-group.custom-switch {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px !important;
        margin-bottom: 0 !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .global-form .form-text.text-muted {
        text-align: center;
    }
    [dir="rtl"] .global-form .form-group.custom-switch {
        padding: 14px 44px 14px 16px !important;
    }

    /* SubmitField renders as a bare <input>, no .form-group wrapper, in
       render_form()'s default "basic" form_type - so it's a direct grid
       child of .toggle-grid and needs the column-span itself. */
    #submit_global {
        grid-column: 1 / -1;
        width: 100%;
        display: block;
        text-align: center;
        margin-top: 12px;
    }
</style>
{% endblock %}
