{% from 'bootstrap4/form.html' import render_form %}

{% extends 'admin-layout.html' %}

{% block title %}{{ _('admin.menu.config') }}{% endblock %}

{% block body %}
{{super()}}
<style>
    @keyframes blink {
        50% {
            border-color: #0000ff;
            border-width: 2px;
        }
    }

    #search_settings {

        animation: blink 1s;
        animation-iteration-count: 3;
        transition: border-width 0.6s linear;
    }

    #search_settings:hover {
        border-width: 2px;
    }
</style>


<div class="card">
    <div class="card-header">
        <input id="search_settings" class="form-control settings-search" type="text" placeholder="{{_(' Search Settings')}}">
    </div>
    <div class="card-body">
        <div class="global-form">
            {{render_form(form,form_type="",extra_classes="settings-grid")}}
        </div>
    </div>
</div>

<style>
    /* Each ConfigCategory renders as <fieldset><legend>+ Label</legend>
       fields...</fieldset> (see SettingAdmin.get_config_form()) - restyled
       here as a clickable card in a 2-col grid, matching the new design's
       Settings index card grid. The existing search/expand JS below still
       targets fieldset/legend/.form-group directly and needs no changes. */
    .global-form .settings-grid {
        display: grid;
    }
    fieldset {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        margin-bottom: 0;
        padding: 16px;
        min-width: 0;
    }
    legend {
        background: transparent;
        margin: 0;
        font-weight: 700;
        font-size: 13.5px;
        color: var(--text-primary);
        cursor: pointer;
        width: 100%;
    }
    legend .fa-plus {
        color: var(--accent);
        margin-{{ 'left' if get_locale()=='fa' else 'right' }}: 8px;
    }
    legend + div > label {
        display: none;
    }
    #submit {
        grid-column: 1 / -1;
    }
</style>

{% endblock %}

{% block tail %}
{{super()}}
<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/42.0.2/ckeditor5.css">
<style>
    .ck.ck-editor {
        color: black !important;
    }
</style>
<script src="https://cdn.ckeditor.com/ckeditor5/42.0.2/ckeditor5.js"></script>

<script type="importmap">
    {
        "imports": {
            "ckeditor5": "https://cdn.ckeditor.com/ckeditor5/42.0.2/ckeditor5.js",
            "ckeditor5/": "https://cdn.ckeditor.com/ckeditor5/42.0.2/"
        }
    }
</script>
<script type="module">
    import {
        ClassicEditor,
        AccessibilityHelp,
        Autosave,
        BalloonToolbar,
        Bold,
        Code,
        Essentials,
        FontBackgroundColor,
        FontColor,
        FontFamily,
        FontSize,
        FullPage,
        GeneralHtmlSupport,
        Highlight,
        HtmlComment,
        HtmlEmbed,
        Italic,
        Paragraph,
        SelectAll,
        ShowBlocks,
        SourceEditing,
        SpecialCharacters,
        Strikethrough,
        ImageBlock,
        ImageInsert,
        ImageInsertViaUrl,
        ImageToolbar,

        Underline,
        Undo
    } from 'ckeditor5';

    const editorConfig = {
        toolbar: {
            items: [
                'undo',
                'redo',
                '|',
                'bold',
                'italic',
                'underline',
                'strikethrough',
                'code',
                'insertImage',
                '|',
                'fontSize',
                'fontColor',
                'fontBackgroundColor',
                '|',
                'sourceEditing',

            ],
            shouldNotGroupWhenFull: false
        },
        plugins: [
            AccessibilityHelp,
            Autosave,
            BalloonToolbar,
            Bold,
            Code,
            Essentials,
            FontBackgroundColor,
            FontColor,
            FontFamily,
            FontSize,
            FullPage,
            GeneralHtmlSupport,
            Highlight,
            HtmlComment,
            HtmlEmbed,
            Italic,
            Paragraph,
            SelectAll,
            ShowBlocks,
            SourceEditing,
            ImageBlock,
            ImageInsertViaUrl,

            Strikethrough,
            Underline,
            Undo
        ],
        balloonToolbar: ['bold', 'italic'],
        fontFamily: {
            supportAllValues: true
        },
        fontSize: {
            options: [10, 12, 14, 'default', 18, 20, 22],
            supportAllValues: true
        },
        htmlSupport: {
            allow: [
                {
                    name: /^.*$/,
                    styles: true,
                    attributes: true,
                    classes: true
                }
            ]
        },

        placeholder: 'Type or paste your content here!'
    };

    ClassicEditor.create(document.querySelector('.ckeditor'), editorConfig);


</script>

<script>
    // $("fieldset .form-group").hide()

    if ($('.form-group').length > 20 || $('.invalid-feedback').length > 0)
        $("fieldset").filter(function () { return !($(this).children().children().is('.invalid-feedback')); }).find('.form-group').hide()

    $("fieldset legend").click(function (e) {
        var has_hidden = $(this.parentNode).find('.form-group:hidden')
        if (has_hidden.length > 0)
            $(this.parentNode).find('.form-group').show('fade')
        else
            $(this.parentNode).find('.form-group').hide('fade')


    })

    $(document).ready(function () {
        $('#search_settings').on('input', function () {
            var searchString = $(this).val().toLowerCase();

            $('fieldset').each(function () {
                field = $(this)
                var fieldfoundMatch = false;
                field.find('.form-group').each(function () {
                    var $labels = $(this).find('label');
                    var foundMatch = false;
                    $labels.each(function () {
                        var labelText = $(this).text().toLowerCase();
                        if (labelText.indexOf(searchString) !== -1) {
                            foundMatch = true;
                            fieldfoundMatch = true;
                            return false; // break out of loop early
                        }
                    });
                    var $inputs = $(this).find('input');
                    $inputs.each(function () {
                        var labelText = $(this).attr('id').toLowerCase();
                        if (labelText.indexOf(searchString) !== -1) {
                            foundMatch = true;
                            fieldfoundMatch = true;
                            return false; // break out of loop early
                        }
                    });
                    if (foundMatch) {
                        $(this).show();
                    } else {
                        $(this).hide();
                    }

                });
                if (fieldfoundMatch) {
                    $(this).show();
                    $(this).find(".form-group").first().show();
                } else {
                    $(this).hide();
                }
                if (searchString == "")
                    $("fieldset").filter(function () { return !($(this).children().children().is('.invalid-feedback')); }).find('.form-group').hide()
            });

        });
    });


</script>
{% endblock %}
