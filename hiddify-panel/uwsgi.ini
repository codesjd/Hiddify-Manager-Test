[uwsgi]

module = hiddifypanel:create_app()
socket = 127.0.0.1:9001
uid=hiddify-panel
buffer-size=32768

#socket = /run/hiddifypanel.sock
#chmod-socket = 660
# reuse existing socket if it exists
#reuse-port = true
# remove socket file on exit
#vacuum = true

max-requests = 100
# The panel's slow paths are I/O (DB queries, outbound calls to Cloudflare/
# GeoIP/domain resolution), not CPU - a thread parked on I/O releases the
# GIL, so threads buy real concurrency here for ~10-20MB/thread instead of
# a full ~100-150MB process per concurrent request (see plan 001, which
# capped workers at 2 for the same OOM reason threads now address more
# cheaply). 4 threads in 1 process comfortably fits under limit-as below.
workers = 1
enable-threads = true
threads = 4
harakiri = 30


http-socket = 127.0.0.1:9000

stats=127.0.0.1:1717
memory-report       = true

die-on-term = true
limit-as = 1000
graceful-timeout = 5
