; xl2tpd config - the L2TP tunnel that runs inside the IPsec transport set
; up by strongSwan (see ipsec.conf). Static; run.sh copies it to
; /etc/xl2tpd/xl2tpd.conf. The 10.92.0.0/24 pool is chosen to not collide
; with WireGuard (10.90.0.0/16) or AmneziaWG (10.91.0.1).
[global]
port = 1701
access control = no

[lns default]
ip range = 10.92.0.10-10.92.0.250
local ip = 10.92.0.1
require authentication = yes
name = hiddify-l2tp
ppp debug = no
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes
