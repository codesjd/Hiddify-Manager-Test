protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
supervised systemd
pidfile /var/run/hiddify-redis-server.pid
loglevel notice
logfile /opt/hiddify-manager/log/system/redis-server.log
databases 16
always-show-logo yes
dir /opt/hiddify-manager/other/redis/
bind 127.0.0.1
# Hiddify low-RAM cap (512 MB VPS target). Redis here is a cache + Celery
# broker only; evicting least-recently-used keys is safe (cache recomputes).
maxmemory 48mb
maxmemory-policy allkeys-lru
